<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Geist; src: url("/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 393px; height: 852px; }
body { font-family: -apple-system, Geist, sans-serif; position: relative; overflow: hidden; background: #141414; -webkit-font-smoothing: antialiased; }
.bg { position: absolute; inset: 0; background: url(img/collabro/export.jpg) top/cover; }
.dim { position: absolute; inset: 0; background: rgba(0,0,0,.45); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; height: 470px; background: #f2f2f6; border-radius: 22px 22px 0 0; padding: 16px 16px 0; }
.grab { width: 36px; height: 5px; border-radius: 3px; background: #c7c7cc; margin: 0 auto 14px; }
.file { display: flex; align-items: center; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid #dcdce1; }
.fi { width: 48px; height: 48px; border-radius: 10px; background: #1a1a1a; display: grid; place-items: center; color: #cbec79; font: 600 12px Geist, sans-serif; }
.file b { display: block; font-size: 16px; font-weight: 600; color: #111; }
.file span { font-size: 13px; color: #8a8a8e; }
.x { margin-left: auto; width: 30px; height: 30px; border-radius: 50%; background: #e3e3e8; display: grid; place-items: center; color: #6c6c70; font-size: 15px; }
.apps { display: flex; justify-content: space-between; padding: 18px 4px; border-bottom: 1px solid #dcdce1; }
.app { width: 66px; display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: 11.5px; color: #222; }
.app i { width: 58px; height: 58px; border-radius: 14px; display: grid; place-items: center; }
.list { background: #fff; border-radius: 12px; margin-top: 16px; }
.row { display: flex; justify-content: space-between; align-items: center; height: 50px; padding: 0 16px; font-size: 16px; color: #111; border-bottom: 1px solid #ececf0; }
.row:last-child { border-bottom: 0; }
.home { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: #111; }
</style></head><body>
<div class="bg"></div><div class="dim"></div>
<div class="sheet">
  <div class="grab"></div>
  <div class="file"><div class="fi">CSV</div><div><b>Kyiv_Tech_Conf_contacts.csv</b><span>23 contacts · 4 KB</span></div><div class="x">✕</div></div>
  <div class="apps">
    <div class="app"><i style="background:#2f80ed"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></i>Mail</div>
    <div class="app"><i style="background:#34c759"><svg width="28" height="28" viewBox="0 0 24 24" fill="#fff"><path d="M12 3C6.5 3 2 6.8 2 11.5c0 2.6 1.4 4.9 3.6 6.5L5 21l3.6-1.8c1 .3 2.2.5 3.4.5 5.5 0 10-3.8 10-8.5S17.5 3 12 3z"/></svg></i>Messages</div>
    <div class="app"><i style="background:#fff;box-shadow:inset 0 0 0 1px #e3e3e8"><svg width="28" height="28" viewBox="0 0 24 24" fill="#2f80ed"><path d="M3 6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></i>Files</div>
    <div class="app"><i style="background:#1a1a1a"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#cbec79" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></svg></i>Sheets</div>
    <div class="app"><i style="background:#e3e3e8"><svg width="24" height="24" viewBox="0 0 24 24" fill="#8a8a8e"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></i>More</div>
  </div>
  <div class="list">
    <div class="row">Copy<span>⧉</span></div>
    <div class="row">Save to Files<span>⇩</span></div>
    <div class="row">Print<span>⎙</span></div>
  </div>
</div>
<div class="home"></div>
<script>Promise.all([document.fonts.ready,new Promise(r=>{const i=new Image();i.onload=i.onerror=r;i.src='img/collabro/export.jpg'})]).then(()=>document.body.dataset.ready=1)</script>
</body></html>
