<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Geist; src: url("/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1920px; height: 1080px; }
body { font-family: Geist, sans-serif; color: #fff; overflow: hidden; position: relative; -webkit-font-smoothing: antialiased; background: #0d0e0b; }
:root { --lime: #cbec79; }

/* the bubble: one flat lime disc, cut by the frame */
.disc { position: absolute; width: 1040px; height: 1040px; border-radius: 50%; left: 900px; top: 150px; background: var(--lime); }
.ring { position: absolute; width: 1240px; height: 1240px; border-radius: 50%; left: 800px; top: 50px; border: 1.5px solid rgba(203,236,121,.28); }

.txt { position: absolute; left: 120px; top: 0; bottom: 0; width: 600px; display: flex; flex-direction: column; justify-content: center; }
.eyebrow { font-size: 15px; letter-spacing: .1em; text-transform: uppercase; color: #a3a69c; display: flex; align-items: center; gap: 12px; }
.eyebrow::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--lime); }
h1 { font-weight: 300; font-size: 150px; letter-spacing: -.05em; line-height: .95; margin-top: 30px; }
h2 { font-weight: 300; font-size: 38px; letter-spacing: -.02em; line-height: 1.18; color: #c9cbc2; margin-top: 26px; }
h2 b { font-weight: 300; color: var(--lime); }
.meta { display: flex; gap: 56px; margin-top: 64px; }
.meta dt { font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: #8b8e84; }
.meta dd { font-size: 22px; margin: 8px 0 0; }

/* iPhone */
.phone { position: absolute; width: 410px; aspect-ratio: 393 / 852; border-radius: 66px; padding: 13px; background: #050505;
  box-shadow: inset 0 0 0 2px #3a3b37, inset 0 0 0 4px #121310, 0 50px 90px -30px rgba(0,0,0,.75), 0 10px 30px -10px rgba(0,0,0,.6); }
.phone .scr { width: 100%; height: 100%; border-radius: 54px; overflow: hidden; position: relative; background: #fff; }
.phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
.phone .island { position: absolute; top: 24px; left: 50%; transform: translateX(-50%); width: 118px; height: 34px; border-radius: 20px; background: #050505; z-index: 2; }
.phone .btn-side { position: absolute; right: -3px; top: 220px; width: 4px; height: 96px; border-radius: 0 3px 3px 0; background: #2a2b27; }
.phone .btn-l1 { position: absolute; left: -3px; top: 180px; width: 4px; height: 60px; border-radius: 3px 0 0 3px; background: #2a2b27; }
.phone .btn-l2 { position: absolute; left: -3px; top: 256px; width: 4px; height: 60px; border-radius: 3px 0 0 3px; background: #2a2b27; }
.pA { left: 960px; top: 168px; }
.pB { left: 1320px; top: 92px; }

/* UI chips in the app's own style */
.chip { position: absolute; display: flex; align-items: center; gap: 14px; padding: 16px 22px 16px 16px; border-radius: 20px; font-size: 19px; box-shadow: 0 24px 50px -18px rgba(0,0,0,.55); white-space: nowrap; }
.chip .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; }
.chip small { display: block; font-size: 14px; opacity: .65; margin-top: 2px; }
.c1 { left: 770px; top: 470px; background: #fff; color: #141513; }
.c1 .ic { background: var(--lime); }
.c2 { left: 1500px; top: 880px; background: #141513; color: #fff; box-shadow: inset 0 0 0 1px #2c2e28, 0 24px 50px -18px rgba(0,0,0,.55); }
.c2 .ic { background: #2c2e28; color: var(--lime); }
</style></head>
<body>
<div class="ring"></div>
<div class="disc"></div>

<div class="txt">
  <p class="eyebrow">Mobile app · team sprint · 2024</p>
  <h1>Collabro</h1>
  <h2>Meet the right people at events. Share contacts <b>without the awkward part.</b></h2>
  <dl class="meta"><div><dt>Type</dt><dd>Real product, MVP</dd></div><div><dt>Team</dt><dd>6 designers</dd></div><div><dt>Focus</dt><dd>Research → UI</dd></div></dl>
</div>

<div class="phone pA"><span class="btn-l1"></span><span class="btn-l2"></span><span class="btn-side"></span><div class="scr"><img src="img/collabro/participants.jpg"></div></div>
<div class="phone pB"><span class="btn-l1"></span><span class="btn-l2"></span><span class="btn-side"></span><div class="scr"><img src="img/collabro/bubble.jpg"></div></div>

<div class="chip c1"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="#141513"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg></span><div>Saved privately<small>They won’t be notified</small></div></div>
<div class="chip c2"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6"/></svg></span><div>Invite accepted<small>Contacts are now open</small></div></div>

<script>Promise.all([document.fonts.ready,...[...document.images].map(i=>i.complete?0:new Promise(r=>i.onload=i.onerror=r))]).then(()=>document.body.dataset.ready=1)</script>
</body></html>
