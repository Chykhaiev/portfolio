<!doctype html>
<html><head><meta charset="utf-8">
<style>
* { box-sizing: border-box; margin: 0; }
html, body { width: 1920px; height: 1080px; }
body { overflow: hidden; position: relative;
  background:
    radial-gradient(ellipse 760px 520px at 66% 52%, rgba(203,236,121,.42), rgba(203,236,121,.12) 42%, rgba(0,0,0,0) 70%),
    radial-gradient(ellipse 420px 300px at 30% 85%, rgba(203,236,121,.10), rgba(0,0,0,0) 70%),
    radial-gradient(ellipse 1400px 900px at 50% 40%, #1a1c17 0%, #0d0e0b 60%, #080907 100%); }
.grain { position: absolute; inset: 0; opacity: .06; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
.stage { position: absolute; inset: 0; perspective: 2600px; perspective-origin: 50% 40%; }
.phone { position: absolute; left: 560px; top: 60px; width: 1000px; height: 2168px; transform-style: preserve-3d;
  transform: rotateX(26deg) rotateY(24deg) rotateZ(-14deg); transform-origin: 50% 30%; }
/* titanium frame */
.frame { position: absolute; inset: 0; border-radius: 160px;
  background: linear-gradient(115deg, #2a2b28 0%, #8d8f88 12%, #3d3e3a 22%, #1d1e1b 50%, #6d6f68 82%, #2a2b28 100%);
  box-shadow: 0 120px 160px -60px rgba(0,0,0,.85), 0 40px 80px -30px rgba(0,0,0,.7), -60px 40px 160px -30px rgba(203,236,121,.35); }
.slab { position: absolute; inset: 0; border-radius: 160px; background: linear-gradient(115deg,#1b1c1a,#5e605a 14%,#262724 30%,#141513 60%,#3a3b37); }
.edge { position: absolute; inset: 10px; border-radius: 150px; background: linear-gradient(160deg,#a9aba3,#4a4b47 30%,#2a2b28 60%,#7a7c75); }
.bezel { position: absolute; inset: 20px; border-radius: 140px; background: #030303; }
.screen { position: absolute; inset: 44px; border-radius: 118px; overflow: hidden; background: #fff; }
.screen img { width: 100%; display: block; }
.glare { position: absolute; inset: 44px; border-radius: 118px; pointer-events: none;
  background: linear-gradient(125deg, rgba(255,255,255,.14) 0%, rgba(255,255,255,.04) 28%, rgba(255,255,255,0) 40%); }
.island { position: absolute; top: 86px; left: 50%; transform: translateX(-50%); width: 300px; height: 88px; border-radius: 50px; background: #000; }
.island::after { content: ""; position: absolute; right: 30px; top: 26px; width: 36px; height: 36px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #2a3550, #07080c 60%); }
.btn { position: absolute; left: -16px; transform: translateZ(-30px); width: 18px; border-radius: 8px 0 0 8px; background: linear-gradient(90deg,#3a3b37,#9a9c95 50%,#4a4b47); }
.b1 { top: 330px; height: 90px; } .b2 { top: 470px; height: 170px; } .b3 { top: 670px; height: 170px; }
.vign { position: absolute; inset: 0; background: radial-gradient(ellipse at 55% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); pointer-events: none; }
</style></head>
<body>
<div class="stage">
  <div class="phone">
    <div class="slab" style="transform:translateZ(-6px)"></div><div class="slab" style="transform:translateZ(-12px)"></div><div class="slab" style="transform:translateZ(-18px)"></div><div class="slab" style="transform:translateZ(-24px)"></div><div class="slab" style="transform:translateZ(-30px)"></div><div class="slab" style="transform:translateZ(-36px)"></div><div class="slab" style="transform:translateZ(-42px)"></div><div class="slab" style="transform:translateZ(-48px)"></div><div class="slab" style="transform:translateZ(-54px)"></div><div class="slab" style="transform:translateZ(-60px)"></div><div class="slab" style="transform:translateZ(-66px)"></div><div class="frame"></div><div class="edge"></div>
    <span class="btn b1"></span><span class="btn b2"></span><span class="btn b3"></span>
    <div class="bezel"></div>
    <div class="screen"><img src="img/collabro/bubble.jpg"></div>
    <div class="island"></div>
    <div class="glare"></div>
  </div>
</div>
<div class="vign"></div>
<div class="grain"></div>
<script>Promise.all([...document.images].map(i=>i.complete?0:new Promise(r=>i.onload=i.onerror=r))).then(()=>document.body.dataset.ready=1)</script>
</body></html>
